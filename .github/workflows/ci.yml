name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: docker build -t gateway:test .
      - run: npm run test:container
        timeout-minutes: 3

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    concurrency:
      group: azure-deploy
      cancel-in-progress: false
    env:
      IMAGE: ghcr.io/fjdvm/brenraphaels-proxy:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}
            ghcr.io/fjdvm/brenraphaels-proxy:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy gateway Container App (min 1)
        id: deploy
        run: ./scripts/azure-deploy.sh
        env:
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          CALLERS: ${{ secrets.CALLERS }}
          FILE_STORAGE_TOKEN: ${{ secrets.FILE_STORAGE_TOKEN }}
          NOTIFICATIONS_TOKEN: ${{ secrets.NOTIFICATIONS_TOKEN }}
          NOTIFICATIONS_GATEWAY_SECRET: ${{ secrets.NOTIFICATIONS_GATEWAY_SECRET }}
          LIVE_TICKET_SECRET: ${{ secrets.LIVE_TICKET_SECRET }}
          CREOMS_SIGNAL_SECRET: ${{ secrets.CREOMS_SIGNAL_SECRET }}
          CREOMS_URL: ${{ vars.CREOMS_URL }}
      - name: Verify deployed health and replicas
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent "https://${{ steps.deploy.outputs.fqdn }}/health"; then break; fi
            [ "$attempt" = 30 ] && exit 1
            sleep 5
          done
          counts=$(az containerapp show -n api-gateway -g rg-brenraphaels \
            --query "[properties.template.scale.minReplicas, properties.template.scale.maxReplicas]" -o tsv | tr '\n' ' ')
          echo "replicas min/max: $counts"
          test "$counts" = "1 2 "
